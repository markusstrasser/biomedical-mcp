[project]
name = "biomedical-mcp"
version = "0.6.0"
description = "Biomedical MCP server — 5 entity composites (gene/variant/drug/protein/disease) over 35 APIs, with a `full` profile exposing all raw per-source tools. PGx (CPIC), drug interactions (DDInter), and somatic (CIViC/OncoKB) included."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2,<4.0",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.35"]

[project.scripts]
biomedical-mcp = "biomedical_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biomedical_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
