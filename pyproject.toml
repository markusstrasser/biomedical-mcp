[project]
name = "biomedical-mcp"
version = "0.4.0"
description = "Biomedical MCP server — 27 APIs, ~80 tools across 15 domains (genes, drugs, variants, proteins, pathways, population, expression, panels, phenotype, GWAS, literature, composite)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0,<4.0",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.35"]

[project.scripts]
biomedical-mcp = "biomedical_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biomedical_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
