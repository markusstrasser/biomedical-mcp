[project]
name = "biomedical-mcp"
version = "0.1.0"
description = "Biomedical data MCP server — Open Targets, ChEMBL, ClinicalTrials.gov, ICD-10, NPI"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.35"]

[project.scripts]
biomedical-mcp = "biomedical_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biomedical_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
